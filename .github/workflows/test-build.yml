

name: Test SparringHub Build

on:
  push:
    branches:
      - arashiapp-patch-1
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/test-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_SUPABASE_URL: https://ftlzduauknqcytnjcmux.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sparringhub-preview
          path: dist/
          if-no-files-found: error
          retention-days: 4
